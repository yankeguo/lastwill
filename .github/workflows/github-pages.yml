name: github-pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # A stale checkout must not finish after a renewal and publish the key.
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: update beacon
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%S.000Z" > beacon.txt
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: render index.html
        run: go run .
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
      # Commit the beacon only after a successful render, so a bad beacon
      # cannot land on main and block later disclosure deploys.
      - name: publish beacon
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add beacon.txt
          if git diff --cached --quiet; then
            echo "beacon unchanged"
          else
            git commit -m "chore: update beacon"
            git push
          fi
      - name: configure pages
        uses: actions/configure-pages@v6
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "dist"
      - name: deploy pages
        id: deployment
        uses: actions/deploy-pages@v5
